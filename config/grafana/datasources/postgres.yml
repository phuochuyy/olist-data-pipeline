apiVersion: 1

# Re-create the datasource on start: older setups provisioned it without a fixed uid,
# and Grafana cannot change the uid of an existing datasource in place.
deleteDatasources:
  - name: PostgreSQL-OlistDW
    orgId: 1

datasources:
  - name: PostgreSQL-OlistDW
    uid: olist-dw  # fixed uid, referenced by the provisioned dashboards
    type: postgres
    url: postgres:5432
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      database: olist_dw  # newer Grafana reads the database here, not from the top-level field
      sslmode: disable
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
      postgresVersion: 1400
      timescaledb: false
    isDefault: true
    editable: true
