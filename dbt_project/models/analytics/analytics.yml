version: 2

models:
  - name: revenue_by_state
    columns:
      - name: customer_state
        tests: [not_null, unique]
      - name: total_revenue
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
  - name: monthly_trends
    columns:
      - name: month
        tests: [not_null, unique]
  - name: top_customers
    columns:
      - name: customer_unique_id
        tests: [not_null, unique]
